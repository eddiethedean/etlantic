site_name: ETLantic
site_description: One typed model for Python data pipelines, with deterministic plans and pluggable execution.
site_url: https://etlantic.readthedocs.io/
repo_url: https://github.com/eddiethedean/etlantic
repo_name: eddiethedean/etlantic
edit_uri: edit/main/docs/
docs_dir: docs

