validation:
  omitted_files: warn
  absolute_links: relative_to_docs
  unrecognized_links: warn
  anchors: warn

theme:
  name: material
  logo: theme/assets/etlantic-logo.svg
  favicon: theme/assets/etlantic-favicon.svg
  font:
    text: Inter
    code: IBM Plex Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: etlantic-light
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - content.action.edit
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow

extra_css:
  - theme/stylesheets/etlantic.css

extra_javascript:
  - theme/javascripts/status-banner.js

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

hooks:
  - docs/hooks.py

plugins:
  - search:
      lang: en
  - mkdocstrings:
      handlers:
        python:
          paths:
            - src
            - packages/etlantic-polars/src
            - packages/etlantic-pandas/src
            - packages/etlantic-sql/src
            - packages/etlantic-pyspark/src
            - packages/etlantic-airflow/src
            - packages/etlantic-prefect/src
            - packages/etlantic-keyring/src
            - packages/etlantic-sqlmodel/src
            - packages/etlantic-datafusion/src
            - packages/etlantic-fastapi/src
            - packages/medallantic/src
          options:
            docstring_style: google
            members_order: source
            show_root_heading: true
            show_source: false
            show_signature_annotations: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            filters:
              - "!^_"
            separate_signature: true
            merge_init_into_class: true

copyright: ETLantic is available under the MIT License.

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/eddiethedean/etlantic
      name: ETLantic on GitHub
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/etlantic/
      name: ETLantic on PyPI
