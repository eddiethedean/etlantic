site_name: ETLantic
site_description: Typed Python data pipelines with validate-before-write.
site_url: https://etlantic.readthedocs.io/
repo_url: https://github.com/eddiethedean/etlantic
repo_name: eddiethedean/etlantic
edit_uri: edit/main/docs/
docs_dir: docs

