name: Checks

on:
  workflow_call:

jobs:
  checks:
    name: Lint and test (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.3"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync dependencies
        run: uv sync --locked

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Pytest (core)
        run: uv run pytest -q -m "not medallantic and not polars and not pandas and not sql and not spark and not real_pyspark and not airflow and not prefect and not keyring and not sqlmodel and not datafusion"

      - name: Pipeline codec burn-in
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: uv run python scripts/check_pipeline_codec_burn_in.py

      - name: Sibling codec burn-in
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: uv run python scripts/check_codec_burn_in_matrix.py

      - name: Documentation consistency
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: uv run python scripts/check_docs.py

      - name: Plugin manifest check
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: uv run python scripts/check_plugin_manifests.py

      - name: Agent guidance drift check
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: uv run python scripts/check_agent_guidance.py

      - name: Transform compiler drift check
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: uv run --group polars --group pandas --group sql --group pyspark --group datafusion python scripts/check_transform_compiler_drift.py

      - name: Release readiness check
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: uv run python scripts/check_release.py

      - name: Surface inventory check
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: uv run python scripts/check_surface_inventory.py

      - name: Runnable example
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: |
          uv run python examples/memory_customers.py
          uv run python examples/pipeline_definition_json.py

      - name: CLI SARIF smoke
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: |
          uv run etlantic validate examples/memory_customers.py:CustomerPipeline --format sarif > /tmp/etlantic.sarif
          python -c "import json; json.load(open('/tmp/etlantic.sarif')); print('sarif ok')"

      - name: MkDocs
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: uv run python scripts/build_docs.py

  dataframes:
    name: Dataframe plugins (${{ matrix.engine }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [polars, pandas]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.3"
          python-version: "3.11"
          enable-cache: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync with one engine plugin
        run: uv sync --locked --group ${{ matrix.engine }}

      - name: Discovery smoke (entry points only)
        run: |
          uv run python -c "
          from etlantic.dataframe.discovery import discover_dataframe_plugins
          found = discover_dataframe_plugins()
          assert '${{ matrix.engine }}' in found, found
          print('discovered', sorted(found))
          "

      - name: Pytest dataframe suite
        run: uv run pytest -q tests/dataframe -m "${{ matrix.engine }}"

      - name: Pytest Polars portable compiler
        if: matrix.engine == 'polars'
        run: uv run pytest -q tests/polars_compiler -m polars

      - name: Pytest Pandas portable compiler
        if: matrix.engine == 'pandas'
        run: uv run pytest -q tests/pandas_compiler -m pandas

      - name: Public portable transform conformance
        run: uv run pytest -q tests/portable_conformance -m "${{ matrix.engine }}"

      - name: Trust and plugin discovery (0.20)
        if: matrix.engine == 'polars'
        run: |
          uv run pytest -q tests/unit/test_trust_isolation_0_20.py
          uv run pytest -q tests/runtime/test_plugin_discovery_profile.py

      - name: Runnable parity example
        run: uv run python examples/dataframe_parity.py ${{ matrix.engine }}

  sql:
    name: SQL plugin
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: etlantic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.3"
          python-version: "3.11"
          enable-cache: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync with SQL plugin
        run: uv sync --locked --group sql

      - name: Discovery smoke
        run: |
          uv run python -c "
          from etlantic.sql.discovery import discover_sql_plugins
          found = discover_sql_plugins()
          assert 'sql' in found, found
          print('discovered', sorted(found))
          "

      - name: Pytest SQL suite (SQLite IR + runtime)
        env:
          ETLANTIC_SQL_URL: "sqlite+pysqlite:///:memory:"
        run: uv run pytest -q tests/sql -m sql

      - name: Pytest SQL suite (PostgreSQL)
        env:
          ETLANTIC_SQL_URL: "postgresql+psycopg://postgres:postgres@localhost:5432/etlantic"
        run: uv run pytest -q tests/sql -m sql

      - name: Runnable SQL examples
        env:
          ETLANTIC_SQL_URL: "postgresql+psycopg://postgres:postgres@localhost:5432/etlantic"
        run: |
          uv run python examples/sql_to_sql.py
          uv run python examples/sql_transactional_write.py
          uv run python examples/sql_boundary_hybrid.py
          uv run python examples/sql_failure_recovery.py

  spark:
    name: PySpark plugin (sparkless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.3"
          python-version: "3.11"
          enable-cache: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync with PySpark plugin + sparkless
        run: uv sync --locked --group pyspark

      - name: Discovery smoke
        run: |
          uv run python -c "
          from etlantic.spark.discovery import discover_spark_plugins
          found = discover_spark_plugins()
          assert 'pyspark' in found, found
          print('discovered', sorted(found))
          "

      - name: Pytest Spark suite (sparkless)
        env:
          SPARKLESS_TEST_MODE: sparkless
        run: uv run pytest -q tests/spark -m spark

      - name: Pytest PySpark portable compiler (sparkless)
        env:
          SPARKLESS_TEST_MODE: sparkless
        run: uv run pytest -q tests/pyspark_compiler -m spark

      - name: Public portable transform conformance (sparkless)
        env:
          SPARKLESS_TEST_MODE: sparkless
        run: uv run pytest -q tests/portable_conformance -m spark

      - name: Runnable Spark example
        env:
          SPARKLESS_TEST_MODE: sparkless
          ETLANTIC_SPARK_BACKEND: sparkless
        run: uv run python examples/pyspark_local.py

  portable-differentials:
    name: Portable Polars ↔ PySpark ↔ Pandas differentials
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.3"
          python-version: "3.11"
          enable-cache: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync Polars + Pandas + PySpark (sparkless)
        run: uv sync --locked --group polars --group pandas --group pyspark

      - name: Discovery smoke (compilers)
        run: |
          uv run python -c "
          from etlantic.transform.discovery import discover_transform_compilers
          found = discover_transform_compilers()
          assert set(found) >= {'polars', 'pyspark', 'pandas'}, found
          print('compilers', sorted(found))
          "

      - name: Pytest portable differentials (sparkless)
        env:
          SPARKLESS_TEST_MODE: sparkless
        run: uv run pytest -q tests/portable_differential

      - name: Public conformance against all three compilers
        env:
          SPARKLESS_TEST_MODE: sparkless
        run: |
          uv run pytest -q tests/portable_conformance -m "polars or pandas or spark"

      - name: Gate A interchange example (Polars ↔ Pandas)
        run: uv run python examples/interchange_polars_pandas.py

  airflow:
    name: Airflow orchestrator plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.3"
          python-version: "3.11"
          enable-cache: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync with Airflow plugin
        run: uv sync --locked --group airflow

      - name: Discovery smoke
        run: |
          uv run python -c "
          from etlantic.orchestration.discovery import discover_orchestrator_plugins
          found = discover_orchestrator_plugins()
          assert 'airflow' in found, found
          print('discovered', sorted(found))
          "

      - name: Pytest orchestration + Airflow compile suite
        run: |
          uv run pytest -q tests/orchestration
          uv run pytest -q tests/airflow -m airflow

      - name: Runnable Airflow compile example
        run: uv run python examples/airflow_compile.py

  prefect:
    name: Prefect scheduler plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.3"
          python-version: "3.11"
          enable-cache: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync with Prefect plugin
        run: uv sync --locked --group prefect

      - name: Discovery smoke
        run: |
          uv run python -c "
          from etlantic.runtime.scheduler_discovery import discover_scheduler_plugins
          found = discover_scheduler_plugins()
          assert 'prefect' in found, found
          print('discovered', sorted(found))
          "

      - name: Pytest Prefect suite
        run: uv run pytest -q tests/prefect -m prefect

      - name: Runnable Prefect example
        run: uv run python examples/prefect_run.py

  keyring:
    name: Keyring secret provider
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.3"
          python-version: "3.11"
          enable-cache: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Sync with keyring package
        run: uv sync --locked --group keyring
      - name: Pytest keyring suite
        run: uv run pytest -q tests/keyring -m keyring

  sqlmodel:
    name: SQLModel integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.3"
          python-version: "3.11"
          enable-cache: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Sync with sqlmodel package
        run: uv sync --locked --group sqlmodel
      - name: Pytest sqlmodel suite
        run: uv run pytest -q tests/sqlmodel -m sqlmodel

  medallantic:
    name: Medallantic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.3"
          python-version: "3.11"
          enable-cache: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Sync with Medallantic
        run: uv sync --locked --group medallantic
      - name: Pytest Medallantic parity suite
        run: uv run pytest -q tests/medallantic -m medallantic

  package:
    name: Build and test wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.3"
          python-version: "3.11"
          enable-cache: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync dependencies
        run: uv sync --locked

      - name: Build core wheel
        run: |
          rm -rf dist
          mkdir -p dist
          uv build --package etlantic

      - name: Build all plugin wheels
        run: |
          for pkg in etlantic-polars etlantic-pandas etlantic-sql etlantic-pyspark \
            etlantic-airflow etlantic-prefect etlantic-keyring etlantic-sqlmodel \
            medallantic etlantic-datafusion; do
            uv build --package "$pkg" --out-dir dist
          done
          ls -la dist/

      - name: Pytest against installed wheel
        shell: bash
        run: |
          shopt -s nullglob
          # Keep only the core package wheel (etlantic-VERSION-...), not plugins.
          core_wheels=()
          for w in dist/etlantic-*.whl; do
            base="$(basename "$w")"
            if [[ "$base" =~ ^etlantic-[0-9] ]]; then
              core_wheels+=("$w")
            fi
          done
          if [ "${#core_wheels[@]}" -ne 1 ]; then
            echo "Expected exactly one etlantic core wheel in dist/, found ${#core_wheels[@]}"
            ls -la dist/ || true
            exit 1
          fi
          WHEEL="${core_wheels[0]}"
          echo "Testing wheel: $WHEEL"
          uv run --isolated --no-project --with "$WHEEL" --with pytest \
            python -m pytest -q tests/unit tests/cli

      - name: Medallantic wheel import smoke
        shell: bash
        run: |
          shopt -s nullglob
          medallantic_wheels=(dist/medallantic-*.whl)
          if [ "${#medallantic_wheels[@]}" -lt 1 ]; then
            echo "Expected medallantic wheel in dist/"
            ls -la dist/ || true
            exit 1
          fi
          MEDALLANTIC_WHEEL="${medallantic_wheels[0]}"
          CORE=""
          for w in dist/etlantic-*.whl; do
            base="$(basename "$w")"
            if [[ "$base" =~ ^etlantic-[0-9] ]]; then
              CORE="$w"
              break
            fi
          done
          echo "Smoke testing: $MEDALLANTIC_WHEEL with $CORE"
          uv run --isolated --no-project --with "$CORE" --with "$MEDALLANTIC_WHEEL" \
            python -c "import medallantic as s; import etlantic; assert s.__version__ == etlantic.__version__; print(s.__version__)"

  benchmarks:
    name: Microbenchmark regression gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.3"
          python-version: "3.11"
          enable-cache: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync dependencies
        run: uv sync --locked

      - name: Benchmark gate
        run: uv run python scripts/check_benchmarks.py

  datafusion:
    name: DataFusion plugin (experimental)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.3"
          python-version: "3.11"
          enable-cache: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync with datafusion plugin
        run: uv sync --locked --group datafusion

      - name: Discovery smoke
        run: |
          uv run python -c "
          from etlantic.dataframe.discovery import discover_dataframe_plugins
          from etlantic.transform.discovery import discover_transform_compilers
          df = discover_dataframe_plugins()
          compilers = discover_transform_compilers()
          assert 'datafusion' in df, df
          assert 'datafusion' in compilers, compilers
          print('discovered', sorted(df), sorted(compilers))
          "

      - name: Pytest datafusion stub suite
        run: uv run pytest -q tests/ -k datafusion -m datafusion

  fastapi:
    name: FastAPI reference adapter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.3"
          python-version: "3.11"
          enable-cache: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync with fastapi extra
        run: uv sync --locked --extra fastapi

      - name: Pytest FastAPI reference suite
        run: |
          uv run pytest -q tests/fastapi packages/etlantic-fastapi/tests

  real-pyspark:
    name: Real PySpark (JVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.3"
          python-version: "3.11"
          enable-cache: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Sync pyspark and dataframe groups
        # dataframes group required: real_pyspark tests import modules that use
        # pytest.importorskip("polars") / importorskip("pandas") at import time.
        run: uv sync --locked --group pyspark --group dataframes

      - name: Real PySpark tests
        env:
          SPARKLESS_TEST_MODE: pyspark
        run: uv run pytest -q -m real_pyspark

  airflow-import:
    name: Airflow import (${{ matrix.airflow-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        airflow-version: ["2.8.4", "2.9.3", "2.10.4"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.3"
          python-version: "3.11"
          enable-cache: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync airflow runtime
        run: uv sync --locked --group airflow --group airflow-runtime

      - name: Pin Airflow version
        run: uv pip install "apache-airflow==${{ matrix.airflow-version }}"

      - name: Compile and import generated DAG
        env:
          ETLANTIC_REQUIRE_AIRFLOW: "1"
        run: uv run pytest -q tests/airflow/test_airflow_compile.py::test_optional_airflow_import_of_generated_dag -m airflow
