[project]
name = "etlantic-iceberg"
version = "0.46.0"
description = "Experimental Apache Iceberg connector for ETLantic (PyIceberg)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Odo Matthews", email = "odosmatthews@gmail.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "etlantic>=0.46.0,<0.47",
]

[project.optional-dependencies]
pyiceberg = ["pyiceberg>=0.7,<1"]

[project.urls]
Homepage = "https://github.com/eddiethedean/etlantic"
Documentation = "https://github.com/eddiethedean/etlantic/tree/main/docs"
Repository = "https://github.com/eddiethedean/etlantic"
Issues = "https://github.com/eddiethedean/etlantic/issues"
Changelog = "https://github.com/eddiethedean/etlantic/blob/main/CHANGELOG.md"

[project.entry-points."etlantic.source_connectors"]
iceberg = "etlantic_iceberg:create_source"

[project.entry-points."etlantic.sink_connectors"]
iceberg = "etlantic_iceberg:create_sink"

[project.entry-points."etlantic.storage_connectors"]
iceberg = "etlantic_iceberg:create_storage"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/etlantic_iceberg"]

[tool.hatch.build.targets.wheel.force-include]
"src/etlantic_iceberg/etlantic-plugin-manifest.json" = "etlantic_iceberg/etlantic-plugin-manifest.json"
