[project]
name = "medallantic"
version = "0.34.0"
description = "Engine-agnostic medallion facade on ETLantic (native authoring + SparkForge IR migrate)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Odo Matthews", email = "odosmatthews@gmail.com" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "etlantic>=0.34.0,<0.35",
]

# Native MedallionPipeline authoring (M1) plus SparkForge IR migrate adapter.

[project.urls]
Homepage = "https://github.com/eddiethedean/etlantic"
Documentation = "https://github.com/eddiethedean/etlantic/tree/main/packages/medallantic/docs"
Repository = "https://github.com/eddiethedean/etlantic"
Issues = "https://github.com/eddiethedean/etlantic/issues"
Changelog = "https://github.com/eddiethedean/etlantic/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/medallantic"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/medallantic",
    "/docs",
    "/README.md",
    "/ROADMAP.md",
    "/pyproject.toml",
]
