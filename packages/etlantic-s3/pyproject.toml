[project]
name = "etlantic-s3"
version = "0.44.0"
description = "Experimental S3-compatible JSON connector for ETLantic."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Odo Matthews", email = "odosmatthews@gmail.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "etlantic>=0.44.0,<0.45",
]

[project.optional-dependencies]
aws = ["boto3>=1.34,<2", "pyarrow>=14"]
boto3 = ["boto3>=1.34,<2"]
pyarrow = ["pyarrow>=14"]

[project.urls]
Homepage = "https://github.com/eddiethedean/etlantic"
Documentation = "https://github.com/eddiethedean/etlantic/tree/main/docs"
Repository = "https://github.com/eddiethedean/etlantic"
Issues = "https://github.com/eddiethedean/etlantic/issues"
Changelog = "https://github.com/eddiethedean/etlantic/blob/main/CHANGELOG.md"

[project.entry-points."etlantic.source_connectors"]
s3 = "etlantic_s3:create_source"

[project.entry-points."etlantic.sink_connectors"]
s3 = "etlantic_s3:create_sink"

[project.entry-points."etlantic.storage_connectors"]
s3 = "etlantic_s3:create_storage"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/etlantic_s3"]

[tool.hatch.build.targets.wheel.force-include]
"src/etlantic_s3/etlantic-plugin-manifest.json" = "etlantic_s3/etlantic-plugin-manifest.json"
