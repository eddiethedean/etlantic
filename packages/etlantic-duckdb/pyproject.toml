[project]
name = "etlantic-duckdb"
version = "0.50.1"
description = "Optional DuckDB SQL execution and portable transform plugin for ETLantic."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Odo Matthews", email = "odosmatthews@gmail.com" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "etlantic>=0.50.0,<0.51",
    "duckdb>=1.0,<2",
    "numpy>=2,<3",
]

[project.urls]
Homepage = "https://github.com/eddiethedean/etlantic"
Documentation = "https://github.com/eddiethedean/etlantic/tree/main/docs"
Repository = "https://github.com/eddiethedean/etlantic"
Issues = "https://github.com/eddiethedean/etlantic/issues"

[project.entry-points."etlantic.sql_plugins"]
duckdb = "etlantic_duckdb:create_plugin"

[project.entry-points."etlantic.transform_compilers"]
duckdb = "etlantic_duckdb.transform_compiler:create_transform_compiler"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/etlantic_duckdb"]

[tool.hatch.build.targets.wheel.force-include]
"src/etlantic_duckdb/etlantic-plugin-manifest.json" = "etlantic_duckdb/etlantic-plugin-manifest.json"
