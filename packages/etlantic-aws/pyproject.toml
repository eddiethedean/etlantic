[project]
name = "etlantic-aws"
version = "0.61.0"
description = "Optional AWS Scheduler and ECS adapters for ETLantic managed execution."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Odo Matthews", email = "odosmatthews@gmail.com" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "etlantic>=0.59.0,<0.62.0",
    "etlantic-rsconnect>=0.60.0,<0.62.0",
]

[project.optional-dependencies]
aws = ["boto3>=1.35,<2"]

[project.scripts]
etlantic-aws-ecs-worker = "etlantic_aws.worker:main"


[project.urls]
Homepage = "https://github.com/eddiethedean/etlantic"
Documentation = "https://github.com/eddiethedean/etlantic/tree/main/docs/11_DEVELOPMENT/ETLANTIC_AWS_PLAN.md"
Repository = "https://github.com/eddiethedean/etlantic"
Issues = "https://github.com/eddiethedean/etlantic/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/etlantic_aws"]

[tool.ruff]
line-length = 88
target-version = "py311"
