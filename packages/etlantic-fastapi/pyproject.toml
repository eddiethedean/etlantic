[project]
name = "etlantic-fastapi"
version = "0.45.0"
description = "FastAPI adapter for ETLantic control-plane (CP1) and authoring reference."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Odo Matthews", email = "odosmatthews@gmail.com" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "etlantic>=0.45.0,<0.46",
    "fastapi>=0.115,<1",
    "pydantic>=2.12,<3",
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1"]

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<9",
]

[project.urls]
Homepage = "https://github.com/eddiethedean/etlantic"
Documentation = "https://etlantic.readthedocs.io/"
Repository = "https://github.com/eddiethedean/etlantic"
Issues = "https://github.com/eddiethedean/etlantic/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/etlantic_fastapi"]
